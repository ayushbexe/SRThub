<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SRThub</title>
  
  <style>
body {
  background: #0e0e0e;
  color: #eaeaea;
  font-family: system-ui, sans-serif;
  padding: 40px;
  max-width: 900px;
  margin: auto;

}

textarea {
  width: 100%;
  min-height: 180px;
  background: #141414;
  color: #eee;
  border: 1px solid #333;
  padding: 12px;
  margin-top: 10px;
  text-align: left;
}

input {
  background: #141414;
  color: #fff;
  border: 1px solid #333;
  padding: 6px;
}

button {
  margin-top: 14px;
  padding: 10px 22px;
  background: #1f1f1f;
  color: #fff;
  border: 1px solid #444;
  cursor: pointer;
}

button:hover {
  background: #2a2a2a;
}
  .app {
  display: flex;
  min-height: 100vh;
}

/* Sidebar */
.sidebar {
  width: 220px;
  border-right: 1px solid #222;
  padding: 30px 20px;
}

.logo {
  margin-bottom: 30px;
  font-size: 22px;
  color: #FFB20F;
}

/* Navigation buttons */
.nav-item {
  display: block;
  width: 100%;
  background: none;
  border: none;
  color: #aaa;
  text-align: left;
  padding: 10px 0;
  cursor: pointer;
  font-size: 15px;
}

.nav-item:hover {
  color: #fff;
}

.nav-item.active {
  color: #fff;
  font-weight: 600;
}

/* Main content */
.content {
  flex: 1;
  padding: 40px;
}

.tool {
  max-width: 900px;
}

/* Hide inactive tools */
.hidden {
  display: none;
}

button:disabled {
  opacity: 0.5;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
  font-size: 14px;
}

th, td {
  border: 1px solid #333;
  padding: 8px;
  text-align: left;
}

th {
  background: #1a1a1a;
}

td.copyable {
  cursor: pointer;
  position: relative;
}

td.copyable:hover {
  background: #1f1f1f;
}

td.copied::after {
  content: "Copied ✓";
  position: absolute;
  right: 8px;
  top: 6px;
  font-size: 11px;
  color: #2ecc71;
}

#exportBar button {
  margin-right: 10px;
}

  
</style>
</head>


<body>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <h2 class="logo">SRThub</h2>

    <nav>
      <button class="nav-item active" onclick="showTool('srt', this)">
        ▷ SRT Generator
      </button>

      <button class="nav-item" onclick="showTool('timestamp', this)">
        ▷ Timestamper
      </button>
      
      <button class="nav-item" onclick="showTool('transliterate', this)">
  ▷ Transliterate
</button>

    </nav>
  </aside>

  <!-- Main Content -->
  <main class="content">

    <!-- SRT TOOL -->
    <section id="srt-tool" class="tool">
      <h1>SRT Generator</h1>
<p>Generate SRT files & timestamped links as per your need</p>
<hr>

<h3>Paste subtitle text / Quoted multi-line text )</h3>
<textarea id="input" placeholder='"Speaker
Dialogue line"'></textarea>

<h3>Seconds per subtitle</h3>
<input type="number" id="duration" value="5" min="1">

<br>
<button onclick="generateSRT()">Generate SRT</button>

<h3>Generated SRT</h3>
<textarea id="output"></textarea>

<br>
<button onclick="downloadSRT()">Download .srt</button>

    </section>

    <!-- TIMESTAMP TOOL (placeholder only) -->
    <section id="timestamp-tool" class="tool hidden">
      <h2>Timestamper</h2>

<!-- Upload SRT -->
      
<p id="fileName" style="opacity:0.7;">Upload .SRT file</p>
<input type="file" id="srtFile" accept=".srt">

<!-- YouTube link -->
<input
  type="text"
  id="ytLink"
  placeholder="Paste YouTube link"
  style="width:100%; margin-top:10px;"
>

<br>

<label style="display:block; margin-top:15px;">
  Time Offset (seconds)
</label>

<input
  type="number"
  id="offset"
  value="-3"
  style="width:120px;"
>

<br>

<button
  id="generateBtn"
  disabled
  style="background:#333; cursor:not-allowed;"
  onclick="generateTimestamps()"
>
Generate Timestamps
</button>

<p id="status" style="opacity:0.7; margin-top:10px;"></p>

   
<hr>

<div id="exportBar" class="hidden" style="margin: 15px 0;">
  <button onclick="downloadCSV()">Download CSV</button>
  <button onclick="downloadChapters()">Download Chapters</button>
</div>

<div id="tableContainer"></div>

</p>
    </section>

<!-- TRANSLITERATION TOOL -->
<section id="transliterate-tool" class="tool hidden">
  <h2>Transliteration</h2>
  <p>Hindi ↔ English transliteration</p>

  <h3>Input</h3>
  <textarea
    id="transInput"
    placeholder="Type or paste text here..."
  ></textarea>

  <!-- ACTION BAR (TOP, ALWAYS VISIBLE) -->
  <div id="transActions" style="margin: 15px 0;">

    <label style="display:block; margin-top:10px;">
  Direction
</label>

<select id="transDirection">
  <option value="en-hi">English → Hindi</option>
  <option value="hi-en">Hindi → English</option>
</select>

    
    <button onclick="runTransliteration(this)">
  Transliterate
</button>


    <button onclick="copyTransOutput()">
      Copy Output
    </button>
  </div>

  <h3>Output</h3>
  <textarea
    id="transOutput"
    placeholder="Transliterated text will appear here..."
    readonly
  ></textarea>
</section>

    
  </main>

</div>

<script>

let srtText = "";
let csvData = [];
let srtBaseName = "timestamps"; // fallback name

// =======================
// Hindi → English MAP
// =======================
const hiToEnMap = {
  'क':'k','ख':'kh','ग':'g','घ':'gh','ङ':'ng',
  'च':'ch','छ':'chh','ज':'j','झ':'jh','ञ':'ny',
  'ट':'t','ठ':'th','ड':'d','ढ':'dh','ण':'n',
  'त':'t','थ':'th','द':'d','ध':'dh','न':'n',
  'प':'p','फ':'ph','ब':'b','भ':'bh','म':'m',
  'य':'y','र':'r','ल':'l','व':'v',
  'श':'sh','ष':'sh','स':'s','ह':'h',

  'ा':'a','ि':'i','ी':'i','ु':'u','ू':'u',
  'े':'e','ै':'ai','ो':'o','ौ':'au',
  'ं':'n','ः':'h','्':'',

  'अ':'a','आ':'aa','इ':'i','ई':'i',
  'उ':'u','ऊ':'u','ए':'e','ऐ':'ai',
  'ओ':'o','औ':'au','ऋ':'ri' };

function transliterateHindiToEnglish(text) {
  return text
    .split('\n')
    .map(line =>
      line
        .split('')
        .map(char => hiToEnMap[char] || char)
        .join('')
        .replace(/\b\w/g, c => c.toUpperCase())
    )
    .join('\n');
}


function copyCell(cell) {
  navigator.clipboard.writeText(cell.textContent);
  cell.classList.add("copied");
  setTimeout(() => cell.classList.remove("copied"), 800);
}

  
function showTool(toolId, btn) {
  document.querySelectorAll(".tool").forEach(t => t.classList.add("hidden"));
  document.getElementById(toolId + "-tool").classList.remove("hidden");

  document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
}

  
function parseEntries(text) {
  // Normalize smart quotes
  text = text
    .replace(/[“”]/g, '"')
    .replace(/[‘’]/g, "'");

  const lines = text.split("\n");
  const entries = [];

  let buffer = [];
  let insideQuotes = false;

  for (let line of lines) {
    line = line.trim();
    if (!line) continue;

    // Start quoted block
    if (line.startsWith('"') && !insideQuotes) {
      insideQuotes = true;
      buffer.push(line.slice(1));
      continue;
    }

    // End quoted block
    if (line.endsWith('"') && insideQuotes) {
      buffer.push(line.slice(0, -1));
      entries.push(buffer.join("\n"));
      buffer = [];
      insideQuotes = false;
      continue;
    }

    // Inside quoted block
    if (insideQuotes) {
      buffer.push(line);
      continue;
    }

    // Normal line
    entries.push(line);
  }

  return entries;
}

function secondsToTime(sec) {
  const h = String(Math.floor(sec / 3600)).padStart(2, '0');
  const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
  const s = String(sec % 60).padStart(2, '0');
  return `${h}:${m}:${s},000`;
}

function generateSRT() {
  const input = document.getElementById("input").value;
  const duration = Number(document.getElementById("duration").value);

  const blocks = parseEntries(input);

  if (!blocks.length) {
    alert("No subtitle entries found");
    return;
  }

  let time = 0;
  let srt = "";

  blocks.forEach((block, i) => {
    srt += `${i + 1}\n`;
    srt += `${secondsToTime(time)} --> ${secondsToTime(time + duration)}\n`;
    srt += `${block}\n\n`;
    time += duration;
  });

  document.getElementById("output").value = srt.trim();
}

function downloadSRT() {
  const text = document.getElementById("output").value;
  if (!text) return;

  let filename = prompt("Enter file name (without .srt):", "SRThub");

  if (filename === null) return; // user cancelled

  filename = filename.trim();
  if (!filename) filename = "SRThub";

  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${filename}.srt`;
  a.click();
}


document.getElementById("srtFile").addEventListener("change", function(e) {
  const file = e.target.files[0];
  if (!file) return;

document.getElementById("fileName").textContent = `Loaded: ${file.name}`;
srtBaseName = file.name.replace(/\.srt$/i, "");


  const reader = new FileReader();
  reader.onload = () => {
    srtText = reader.result;
    checkReady();
  };
  reader.readAsText(file);
});

document.getElementById("ytLink").addEventListener("input", checkReady);

function checkReady() {
  const link = document.getElementById("ytLink").value.trim();
  const btn = document.getElementById("generateBtn");

  if (srtText && link) {
    btn.disabled = false;
    btn.style.background = "#2ecc71";
    btn.style.cursor = "pointer";
  }
}

function timeToSeconds(t) {
  const [h, m, rest] = t.split(":");
  const [s, ms] = rest.split(",");
  return (+h * 3600) + (+m * 60) + (+s);
}

function secondsToTimestamp(sec) {
  return Math.max(sec, 0);
}



function generateTimestamps() {
  const yt = document.getElementById("ytLink").value.trim();
  let videoId = "";

  if (yt.includes("youtu.be/")) {
    videoId = yt.split("youtu.be/")[1].split("?")[0];
  } else if (yt.includes("v=")) {
    videoId = yt.split("v=")[1].split("&")[0];
  }

  // Normalize line endings
  const clean = srtText.replace(/\r/g, "").trim();

  // Split by subtitle index (1\n, 2\n, etc.)
  const blocks = clean.split(/\n(?=\d+\n)/);

  csvData = [];

  let html = `
    <table>
      <tr>
        <th>Subtitle Text</th>
        <th>Duration</th>
        <th>Start Time</th>
        <th>Start (Adjusted)</th>

        <th>Timestamped Link</th>
        <th>YouTube Link</th>
      </tr>
  `;

  blocks.forEach(block => {
    const lines = block.split("\n").filter(Boolean);

    if (lines.length < 3) return; // invalid block, skip

    const timeLine = lines[1];
    if (!timeLine.includes("-->")) return;

    const [start, end] = timeLine.split(" --> ");
    const startSec = timeToSeconds(start);
    const endSec = timeToSeconds(end);
    const duration = endSec - startSec;
    const offset = Number(document.getElementById("offset").value) || 0;
    const adjustedStart = secondsToTimestamp(startSec + offset);


    const text = lines.slice(2).join(" | ");

    const tsLink = `https://youtube.com/watch?v=${videoId}&t=${adjustedStart}s`;


html += `
  <tr>
    <td class="copyable" onclick="copyCell(this)">${text}</td>
    <td>${duration}s</td>
    <td>${start}</td>
    <td>${adjustedStart}s</td>
    <td class="copyable" onclick="copyCell(this)">${tsLink}</td>
    <td class="copyable" onclick="copyCell(this)">${yt}</td>
  </tr>
`;


csvData.push([
  text,
  duration,
  start,
  adjustedStart,
  tsLink,
  yt
]);

  });

  html += "</table>";
  document.getElementById("tableContainer").innerHTML = html;
  document.getElementById("exportBar").classList.remove("hidden");


  document.getElementById("status").textContent =
  `Processed ${csvData.length} subtitles`;

}

function downloadCSV() {
  let csv = "Subtitle Text,Duration,Start Time,Start (t-3),Timestamped Link,YouTube Link\n";

  csvData.forEach(row => {
    csv += row.map(v => `"${v}"`).join(",") + "\n";
  });

  const blob = new Blob(["\uFEFF" + csv], {
  type: "text/csv;charset=utf-8"
});

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${srtBaseName}_SRThub.csv`;
  a.click();
}

function downloadChapters() {
  let text = "";

  csvData.forEach(row => {
    const startSeconds = row[3];
    const title = row[0].split("|")[0];
    const min = Math.floor(startSeconds / 60);
    const sec = String(startSeconds % 60).padStart(2, "0");
    text += `${min}:${sec} ${title}\n`;
  });

  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "youtube_chapters.txt";
  a.click();
}

async function runTransliteration(btn) {
  const input = document.getElementById("transInput").value.trim();
  const output = document.getElementById("transOutput");
  const dir = document.getElementById("transDirection").value;

  if (!input) {
    alert("Please enter text");
    return;
  }

  btn.disabled = true;
  btn.textContent = "Transliterating…";

  try {
    let result = "";

    if (dir === "en-hi") {
      const url =
        "https://inputtools.google.com/request?text=" +
        encodeURIComponent(input) +
        "&itc=hi-t-i0-und&num=1";

      const res = await fetch(url);
      const data = await res.json();

      if (data[0] !== "SUCCESS") throw new Error("EN→HI failed");

      result = data[1][0][1][0];
    } else {
  // Hindi → English (OFFLINE, SAFE)
  result = transliterateHindiToEnglish(input);
}


    output.value = result;
  } catch (err) {
    console.error(err);
    output.value = "⚠️ Transliteration failed.";
  } finally {
    btn.disabled = false;
    btn.textContent = "Transliterate";
  }
}




function copyTransOutput() {
  const out = document.getElementById("transOutput").value;
  if (!out) return;

  navigator.clipboard.writeText(out);
  alert("Copied");
}


</script>
</body>
</html>
