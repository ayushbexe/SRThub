<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SRThub</title>

<style>
body {
  background: #0e0e0e;
  color: #eaeaea;
  font-family: system-ui, sans-serif;
  padding: 40px;
  max-width: 900px;
  margin: auto;

}

textarea {
  width: 100%;
  min-height: 180px;
  background: #141414;
  color: #eee;
  border: 1px solid #333;
  padding: 12px;
  margin-top: 10px;
  text-align: left;
}

input {
  background: #141414;
  color: #fff;
  border: 1px solid #333;
  padding: 6px;
}

button {
  margin-top: 14px;
  padding: 10px 22px;
  background: #1f1f1f;
  color: #fff;
  border: 1px solid #444;
  cursor: pointer;
}

button:hover {
  background: #2a2a2a;
}
  .app {
  display: flex;
  min-height: 100vh;
}

/* Sidebar */
.sidebar {
  width: 220px;
  border-right: 1px solid #222;
  padding: 30px 20px;
}

.logo {
  margin-bottom: 30px;
  font-size: 22px;
}

/* Navigation buttons */
.nav-item {
  display: block;
  width: 100%;
  background: none;
  border: none;
  color: #aaa;
  text-align: left;
  padding: 10px 0;
  cursor: pointer;
  font-size: 15px;
}

.nav-item:hover {
  color: #fff;
}

.nav-item.active {
  color: #fff;
  font-weight: 600;
}

/* Main content */
.content {
  flex: 1;
  padding: 40px;
}

.tool {
  max-width: 900px;
}

/* Hide inactive tools */
.hidden {
  display: none;
}

button:disabled {
  opacity: 0.5;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
  font-size: 14px;
}

th, td {
  border: 1px solid #333;
  padding: 8px;
  text-align: left;
}

th {
  background: #1a1a1a;
}


</style>
</head>

<body>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <h2 class="logo">SRThub</h2>

    <nav>
      <button class="nav-item active" onclick="showTool('srt', this)">
        ▷ SRT Generator
      </button>

      <button class="nav-item" onclick="showTool('timestamp', this)">
        ▷ Timestamper
      </button>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="content">

    <!-- SRT TOOL -->
    <section id="srt-tool" class="tool">
      <h1>SRT Generator</h1>
<p>Generate SRT files & timestamped links as per your need</p>
<hr>

<h3>Paste quoted subtitle text</h3>
<textarea id="input" placeholder='"Speaker
Dialogue line"'></textarea>

<h3>Seconds per subtitle</h3>
<input type="number" id="duration" value="5" min="1">

<br>
<button onclick="generateSRT()">Generate SRT</button>

<h3>Generated SRT</h3>
<textarea id="output"></textarea>

<br>
<button onclick="downloadSRT()">Download .srt</button>

    </section>

    <!-- TIMESTAMP TOOL (placeholder only) -->
    <section id="timestamp-tool" class="tool hidden">
      <h2>Timestamper</h2>
      <p><h2>Timestamper</h2>

<!-- Upload SRT -->
<input type="file" id="srtFile" accept=".srt">
<p id="fileName" style="opacity:0.7;"></p>

<!-- YouTube link -->
<input
  type="text"
  id="ytLink"
  placeholder="Paste YouTube link"
  style="width:100%; margin-top:10px;"
>

<br>

<button
  id="generateBtn"
  disabled
  style="background:#333; cursor:not-allowed;"
  onclick="generateTimestamps()"
>
Generate Timestamps
</button>

<hr>

<div id="tableContainer"></div>

<br>
<button
  id="downloadCSV"
  class="hidden"
  onclick="downloadCSV()"
>
Download CSV
</button>
</p>
    </section>

  </main>

</div>

<script>

function showTool(toolId, btn) {
  document.querySelectorAll(".tool").forEach(t => t.classList.add("hidden"));
  document.getElementById(toolId + "-tool").classList.remove("hidden");

  document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
}

  
function parseEntries(text) {
  // Normalize smart quotes
  text = text
    .replace(/[“”]/g, '"')
    .replace(/[‘’]/g, "'");

  const lines = text.split("\n");
  const entries = [];

  let buffer = [];
  let insideQuotes = false;

  for (let line of lines) {
    line = line.trim();
    if (!line) continue;

    // Start quoted block
    if (line.startsWith('"') && !insideQuotes) {
      insideQuotes = true;
      buffer.push(line.slice(1));
      continue;
    }

    // End quoted block
    if (line.endsWith('"') && insideQuotes) {
      buffer.push(line.slice(0, -1));
      entries.push(buffer.join("\n"));
      buffer = [];
      insideQuotes = false;
      continue;
    }

    // Inside quoted block
    if (insideQuotes) {
      buffer.push(line);
      continue;
    }

    // Normal line
    entries.push(line);
  }

  return entries;
}

function secondsToTime(sec) {
  const h = String(Math.floor(sec / 3600)).padStart(2, '0');
  const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
  const s = String(sec % 60).padStart(2, '0');
  return `${h}:${m}:${s},000`;
}

function generateSRT() {
  const input = document.getElementById("input").value;
  const duration = Number(document.getElementById("duration").value);

  const blocks = parseEntries(input);

  if (!blocks.length) {
    alert("No subtitle entries found");
    return;
  }

  let time = 0;
  let srt = "";

  blocks.forEach((block, i) => {
    srt += `${i + 1}\n`;
    srt += `${secondsToTime(time)} --> ${secondsToTime(time + duration)}\n`;
    srt += `${block}\n\n`;
    time += duration;
  });

  document.getElementById("output").value = srt.trim();
}

function downloadSRT() {
  const text = document.getElementById("output").value;
  if (!text) return;

  let filename = prompt("Enter file name (without .srt):", "SRThub");

  if (filename === null) return; // user cancelled

  filename = filename.trim();
  if (!filename) filename = "SRThub";

  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${filename}.srt`;
  a.click();
}

let srtText = "";
let csvData = [];

document.getElementById("srtFile").addEventListener("change", function(e) {
  const file = e.target.files[0];
  if (!file) return;

  document.getElementById("fileName").textContent = `Loaded: ${file.name}`;

  const reader = new FileReader();
  reader.onload = () => {
    srtText = reader.result;
    checkReady();
  };
  reader.readAsText(file);
});

document.getElementById("ytLink").addEventListener("input", checkReady);

function checkReady() {
  const link = document.getElementById("ytLink").value.trim();
  const btn = document.getElementById("generateBtn");

  if (srtText && link) {
    btn.disabled = false;
    btn.style.background = "#2ecc71";
    btn.style.cursor = "pointer";
  }
}

function timeToSeconds(t) {
  const [h, m, rest] = t.split(":");
  const [s, ms] = rest.split(",");
  return (+h * 3600) + (+m * 60) + (+s);
}

function secondsToTimestamp(sec) {
  return Math.max(sec, 0);
}

function generateTimestamps() {
  const yt = document.getElementById("ytLink").value.trim();
  let videoId = "";

if (yt.includes("youtu.be/")) {
  videoId = yt.split("youtu.be/")[1].split("?")[0];
} else if (yt.includes("v=")) {
  videoId = yt.split("v=")[1].split("&")[0];
}


  const entries = srtText.trim().split("\n\n");
  csvData = [];

  let html = `
  <table>
    <tr>
      <th>Subtitle Text</th>
      <th>Duration</th>
      <th>Start Time</th>
      <th>Start (t-3)</th>
      <th>Timestamped Link</th>
      <th>YouTube Link</th>
    </tr>
  `;

  entries.forEach(e => {
    const lines = e.split("\n");
    const timeLine = lines[1];
    const text = lines
  .slice(2)
  .filter(l => l.trim() && !l.includes("-->"))
  .join(" | ");


    const [start, end] = timeLine.split(" --> ");
    const startSec = timeToSeconds(start);
    const endSec = timeToSeconds(end);
    const duration = endSec - startSec;
    const startMinus3 = secondsToTimestamp(startSec - 3);

    const tsLink = `https://youtube.com/watch?v=${videoId}&t=${startMinus3}s`;

    html += `
      <tr>
        <td>${text}</td>
        <td>${duration}s</td>
        <td>${start}</td>
        <td>${startMinus3}s</td>
        <td>${tsLink}</td>
        <td>${yt}</td>
      </tr>
    `;

    csvData.push([
      text,
      duration,
      start,
      startMinus3,
      tsLink,
      yt
    ]);
  });

  html += "</table>";
  document.getElementById("tableContainer").innerHTML = html;
  document.getElementById("downloadCSV").classList.remove("hidden");
}

function downloadCSV() {
  let csv = "Subtitle Text,Duration,Start Time,Start (t-3),Timestamped Link,YouTube Link\n";

  csvData.forEach(row => {
    csv += row.map(v => `"${v}"`).join(",") + "\n";
  });

  const blob = new Blob(["\uFEFF" + csv], {
  type: "text/csv;charset=utf-8"
});

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "timestamps.csv";
  a.click();
}


</script>
</body>
</html>
