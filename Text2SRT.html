<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SRThub – Smart Subtitle Generator</title>
<style>
body { font-family: Arial, sans-serif; padding: 20px; max-width: 900px; margin: auto; }
textarea { width: 100%; min-height: 200px; margin-top: 10px; }
input { padding: 6px; width: 80px; }
button { padding: 10px 20px; margin-top: 10px; cursor: pointer; }
h1 { margin-bottom: 5px; }
small { color: #555; }
</style>
</head>

<body>

<h1>SRThub</h1>
<small>Smart SRT generator for subtitle editors</small>

<h3>Paste your text</h3>
<textarea id="input" placeholder='Paste quoted multi-line entries here'></textarea>

<h3>Settings</h3>
Seconds per subtitle:
<input type="number" id="duration" value="5" min="1">

<br><br>
<button onclick="generateSRT()">Generate SRT</button>

<h3>Generated SRT</h3>
<textarea id="output"></textarea>

<br>
<button onclick="downloadSRT()">Download .srt</button>

<script>
function parseQuotedBlocks(text) {
  const regex = /"([\s\S]*?)"/g;
  let match;
  const blocks = [];

  while ((match = regex.exec(text)) !== null) {
    blocks.push(match[1].trim());
  }
  return blocks;
}

function secondsToTime(sec) {
  const h = String(Math.floor(sec / 3600)).padStart(2, '0');
  const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
  const s = String(sec % 60).padStart(2, '0');
  return `${h}:${m}:${s},000`;
}

function generateSRT() {
  const input = document.getElementById("input").value;
  const duration = parseInt(document.getElementById("duration").value);

  const blocks = parseQuotedBlocks(input);
  if (!blocks.length) {
    alert("No quoted entries found");
    return;
  }

  let currentTime = 0;
  let srt = "";

  blocks.forEach((block, i) => {
    const start = secondsToTime(currentTime);
    const end = secondsToTime(currentTime + duration);

    srt += `${i + 1}\n`;
    srt += `${start} --> ${end}\n`;
    srt += `${block}\n\n`;

    currentTime += duration;
  });

  document.getElementById("output").value = srt.trim();
}

function downloadSRT() {
  const text = document.getElementById("output").value;
  if (!text) return alert("Nothing to download");

  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "SRThub.srt";
  a.click();

  URL.revokeObjectURL(url);
}
</script>

</body>
</html>
