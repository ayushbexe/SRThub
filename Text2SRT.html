<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SRThub</title>

<style>
body {
  background: #0e0e0e;
  color: #eaeaea;
  font-family: system-ui, sans-serif;
  padding: 40px;
  max-width: 900px;
  margin: auto;
}

textarea {
  width: 100%;
  min-height: 180px;
  background: #141414;
  color: #eee;
  border: 1px solid #333;
  padding: 12px;
  margin-top: 10px;
}

input {
  background: #141414;
  color: #fff;
  border: 1px solid #333;
  padding: 6px;
}

button {
  margin-top: 14px;
  padding: 10px 22px;
  background: #1f1f1f;
  color: #fff;
  border: 1px solid #444;
  cursor: pointer;
}

button:hover {
  background: #2a2a2a;
}
</style>
</head>

<body>

<h1>SRThub</h1>
<p>Generate SRT files & timestamped links as per your need</p>
<hr>

<h3>Paste quoted subtitle text</h3>
<textarea id="input" placeholder='"Speaker
Dialogue line"'></textarea>

<h3>Seconds per subtitle</h3>
<input type="number" id="duration" value="5" min="1">

<br>
<button onclick="generateSRT()">Generate SRT</button>

<h3>Generated SRT</h3>
<textarea id="output"></textarea>

<br>
<button onclick="downloadSRT()">Download .srt</button>

<script>
function parseQuotedBlocks(text) {
  const regex = /"([\\s\\S]*?)"/g;
  let match, blocks = [];
  while ((match = regex.exec(text)) !== null) {
    blocks.push(match[1].trim());
  }
  return blocks;
}

function secondsToTime(sec) {
  const h = String(Math.floor(sec / 3600)).padStart(2, '0');
  const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
  const s = String(sec % 60).padStart(2, '0');
  return `${h}:${m}:${s},000`;
}

function generateSRT() {
  const input = document.getElementById("input").value;
  const duration = Number(document.getElementById("duration").value);
  const blocks = parseQuotedBlocks(input);

  if (!blocks.length) {
    alert("No quoted blocks found");
    return;
  }

  let time = 0;
  let srt = "";

  blocks.forEach((block, i) => {
    srt += `${i + 1}\n`;
    srt += `${secondsToTime(time)} --> ${secondsToTime(time + duration)}\n`;
    srt += `${block}\n\n`;
    time += duration;
  });

  document.getElementById("output").value = srt.trim();
}

function downloadSRT() {
  const text = document.getElementById("output").value;
  if (!text) return;

  const blob = new Blob([text], { type: "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "SRThub.srt";
  a.click();
}
</script>

</body>
</html>
